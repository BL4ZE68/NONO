<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nono — Créez et partagez vos galeries photos avec style.">
    <title>Nono — Galerie Photos</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome (with SRI) -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <!-- Ambient background glow -->
    <div class="glow" aria-hidden="true"></div>

    <div class="container">
        <!-- Header -->
        <header class="album-header">
            <h1 class="album-title">Mon Album Photo</h1>
            <p class="album-description">Créez et partagez vos souvenirs précieux</p>
        </header>

        <!-- Upload zone -->
        <div class="upload-area" id="upload-area" role="region" aria-label="Zone de dépôt de photos">
            <span class="upload-icon" aria-hidden="true">
                <i class="fas fa-cloud-upload-alt"></i>
            </span>
            <h2 class="upload-text">Glissez et déposez vos photos ici</h2>
            <p>ou</p>
            <button class="btn" id="select-files" aria-controls="file-input">
                <i class="fas fa-folder-open" aria-hidden="true"></i>
                Sélectionner des fichiers
            </button>
            <!-- Labelled input for screen readers -->
            <label for="file-input" class="sr-only">Sélectionner des photos depuis votre appareil</label>
            <input type="file" id="file-input" multiple accept="image/*" aria-label="Sélectionner des photos">
        </div>

        <!-- Gallery controls -->
        <div class="gallery-controls" role="toolbar" aria-label="Contrôles de la galerie">
            <button class="btn" id="start-slideshow">
                <i class="fas fa-play" aria-hidden="true"></i> Diaporama
            </button>
            <button class="btn" id="clear-gallery">
                <i class="fas fa-trash" aria-hidden="true"></i> Vider la galerie
            </button>
        </div>

        <!-- Photo grid -->
        <div class="gallery-container">
            <div class="gallery" id="gallery" role="list" aria-label="Galerie de photos">
                <!-- Images injected by main.js -->
            </div>
        </div>

        <!-- Fullscreen slideshow -->
        <div
            class="slideshow-container"
            id="slideshow"
            role="dialog"
            aria-modal="true"
            aria-label="Diaporama"
            aria-hidden="true">

            <button class="close-slideshow" id="close-slideshow" aria-label="Fermer le diaporama">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>

            <div id="slides" aria-live="polite" aria-atomic="true"></div>

            <div class="slideshow-controls" role="group" aria-label="Contrôles du diaporama">
                <button class="btn-slideshow" id="prev-slide" aria-label="Image précédente">
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>
                <div class="slide-counter" aria-live="polite" aria-atomic="true">
                    <span id="current-slide">1</span> / <span id="total-slides">0</span>
                </div>
                <button class="btn-slideshow" id="next-slide" aria-label="Image suivante">
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Visually-hidden utility class (used for the file input label) -->
    <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
